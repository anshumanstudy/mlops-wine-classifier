name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Runs at 9:00 AM UTC every Monday and Thursday
    - cron: '0 9 * * 1,4'
  workflow_dispatch:  # lets you manually trigger a run from the Actions tab, for testing

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint with flake8
        run: flake8 train.py tests/ --max-line-length=100

      - name: Run tests
        run: pytest tests/ -v

      - name: Train model
        run: python train.py
